[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crystals"
version = "0.1.0"
description = "Standard-library act-bound memory matching for any agent"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
crystals = "crystals.cli:main"
crystals-mcp = "crystals.mcp:main"

[tool.setuptools]
packages = ["crystals"]
